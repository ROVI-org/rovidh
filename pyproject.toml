[project]
name = "rovidh"
version = "0.1.0"
description = "ROVI Data Hub Vendor Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "dotenv>=0.9.9",
    "pydanclick",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "requests-toolbelt>=1.0.0",
]
authors = [
    { name = "Grant, Josh", email = "grantjn@ornl.gov" },
    { name = "Broughton, Mitchell", email = "broxsonmr@ornl.gov" },
    { name = "Srikanth, Allu", email = "allus@ornl.gov" },
]

[project.scripts]
rovidh = "rovidh:cli"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pydanclick = { git = "https://github.com/perdiesman/pydanclick.git" }
